- name: Create server with Calculator application
  hosts: localhost
  connection: local
  gather_facts: False
  vars_files:
    - group_vars/env

  tasks:
  - name: create VPC network
    google.cloud.gcp_compute_network:
      name: "{{ vpc_name }}"
      auto_create_subnetworks: no
      project: "{{ gcp_project }}"
      auth_kind: "{{ gcp_auth_kind }}"
      service_account_file: "{{ gcp_cred_file }}"
      state: present
    register: network

  - name: create subnet
    google.cloud.gcp_compute_subnetwork:
      name: "{{ subnet_name }}"
      ip_cidr_range: "{{ subnet_cidr }}"
      network: "{{ network }}"
      region: "{{ gcp_region }}"
      project: "{{ gcp_project }}"
      auth_kind: "{{ gcp_auth_kind }}"
      service_account_file: "{{ gcp_cred_file }}"
      state: present
    register: subnet

  - name: create firewall rule - allow SSH
    google.cloud.gcp_compute_firewall:
      name: "{{ vpc_name }}-allow-ssh"
      allowed:
        - ip_protocol: tcp
          ports:
            - '22'
      source_ranges:
        - 0.0.0.0/0
      network: "{{ network }}"
      project: "{{ gcp_project }}"
      auth_kind: "{{ gcp_auth_kind }}"
      service_account_file: "{{ gcp_cred_file }}"
      state: present
    register: firewall_ssh

  - name: create firewall rule - allow HTTP
    google.cloud.gcp_compute_firewall:
      name: "{{ vpc_name }}-allow-http"
      allowed:
        - ip_protocol: tcp
          ports:
            - '80'
      source_ranges:
        - 0.0.0.0/0
      network: "{{ network }}"
      project: "{{ gcp_project }}"
      auth_kind: "{{ gcp_auth_kind }}"
      service_account_file: "{{ gcp_cred_file }}"
      state: present
    register: firewall_http

  - name: Create address for instance
    google.cloud.gcp_compute_address:
      name: "{{ server_name }}-address"
      region: "{{ gcp_region }}"
      project: "{{ gcp_project }}"
      auth_kind: "{{ gcp_auth_kind }}"
      service_account_file: "{{ gcp_cred_file }}"
      state: present
    register: address

  - name: Create server instance
    google.cloud.gcp_compute_instance:
      name: "{{ server_name }}"
      machine_type: "{{ machine_type }}"
      zone: "{{ gcp_zone }}"
      project: "{{ gcp_project }}"
      auth_kind: "{{ gcp_auth_kind }}"
      service_account_file: "{{ gcp_cred_file }}"
      state: present
      disks:
        - auto_delete: true
          boot: true
          initialize_params:
            disk_size_gb: "{{ server_volume_size }}"
            source_image: "{{ gcp_ubuntu_image }}"
      network_interfaces:
        - network: "{{ network }}"
          subnetwork: "{{ subnet }}"
          access_configs:
            - name: External NAT
              nat_ip: "{{ address }}"
              type: ONE_TO_ONE_NAT
      tags:
        items:
          - http-server
          - https-server
      labels:
        environment: "{{ env }}"
      metadata:
        ssh-keys: "ubuntu:{{ ssh_public_key }}"
    register: instance

  # - debug: var=instance

  # - debug: var=instance.networkInterfaces[0].accessConfigs[0].natIP

  - name: Add server public IP to application host group
    add_host: 
      hostname: "{{ instance.networkInterfaces[0].accessConfigs[0].natIP }}"
      groups: app
      ansible_user: ubuntu
      ansible_ssh_private_key_file: "{{ ssh_private_key_file }}"
      ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

  - name: Wait for SSH to start using external IP
    wait_for:
      host: "{{ instance.networkInterfaces[0].accessConfigs[0].natIP }}"
      port: 22
      timeout: 300

##############################################################
- name: Setup app server
  hosts: app
  user: ubuntu
  become: yes
  gather_facts: False
  vars_files:
    - group_vars/docker.env
  tasks:

    - name: add GPG key_name
      ansible.builtin.shell: wget -qO - https://download.docker.com/linux/debian/gpg | sudo apt-key add -

    - name: Wait for GPG key to be registered
      pause:
        seconds: 10
      
    - name: Add Docker Repository
      apt_repository:
        repo: deb https://download.docker.com/linux/debian bookworm stable
        state: present

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: latest
        update_cache: true

    - name: restart docker service
      service:
        name: docker
        state: restarted
        enabled: yes
    
    - name: copy file with owner and permissions
      copy: 
        src: ~/.ssh/id_rsa
        dest: ~/.ssh/id_rsa
        mode: '0600'

    - name: Clone my app repo
      git:
        repo: git@github.com:Maoratt2007/Calculate_Padel_Score.git
        dest: /opt/app
        version: main
        key_file: ~/.ssh/id_rsa
        accept_hostkey: yes
        force: yes

    - name: build docker image and push to DockerHub
      shell: "{{ item }}"
      args:
        chdir: /opt/app
      with_items:
        - docker login -u {{ docker_user }} -p {{ docker_token }}
        - docker build . --tag {{ docker_user }}/pass_gen:latest
        - docker push {{ docker_user }}/pass_gen:latest

    - name: start docker app
      shell: docker compose up -d
      args:
        chdir: /opt/app

    - name: get public IP from server
      shell: curl ident.me
      register: ip_address

    -debug: 
      msg: 
        - "Don't forget to change the HOST secret in GitHub to {{ ip_address.stdout }}"
        - "your app is ready to go at http://{{ ip_address.stdout }}"
